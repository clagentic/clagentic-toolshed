<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">
  <defs>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="104" y2="104">
      <stop offset="0%"   stop-color="#00CFFF"/>
      <stop offset="45%"  stop-color="#4A7FE8"/>
      <stop offset="100%" stop-color="#7B3FE4"/>
    </linearGradient>
  </defs>

  <!-- Standard terminal frame -->
  <rect x="8" y="8" width="96" height="96" rx="8" ry="8"
        fill="none" stroke="url(#grad)" stroke-width="4.5"/>

  <!-- Shed: peaked roof over two walls and a floor line, X-braced barn door in the
       middle (dimmed brace) -- a vetted place agents' tools are kept and checked out from. -->

  <!-- Roof -->
  <polyline points="22,52 56,26 90,52"
            fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Walls and floor -->
  <polyline points="32,45 32,86 80,86 80,45"
            fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Barn door with X brace -->
  <rect x="44" y="58" width="24" height="28" rx="1.5" ry="1.5"
        fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 44 58 L 68 86 M 68 58 L 44 86"
        fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

</svg>
