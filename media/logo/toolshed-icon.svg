<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">
  <defs>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="104" y2="104">
      <stop offset="0%"   stop-color="#00CFFF"/>
      <stop offset="45%"  stop-color="#4A7FE8"/>
      <stop offset="100%" stop-color="#7B3FE4"/>
    </linearGradient>
  </defs>

  <!-- Standard terminal frame -->
  <rect x="8" y="8" width="96" height="96" rx="8" ry="8"
        fill="none" stroke="url(#grad)" stroke-width="4.5"/>

  <!-- Lean-to shed: one single-slope roof (high left, low right) over two walls of
       different height and a floor line; the front stays closed, with an open-jaw
       wrench set diagonally on it -- the tools are kept inside. -->

  <!-- Roof -->
  <line x1="20" y1="36" x2="92" y2="52"
        stroke="url(#grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Walls and floor -->
  <polyline points="30,38 30,88 82,88 82,50"
            fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Open-end wrench outline: straight handle with a rounded butt, widening into a
       head whose jaw is a U notch, on the diagonal lower-left to upper-right -->
  <path d="M 40.13 76.01 L 52.19 64.45 L 53.20 58.30 L 61.84 50.02 L 64.60 52.90 L 58.84 58.42 L 64.36 64.18 L 70.12 58.66 L 72.88 61.54 L 64.24 69.82 L 58.05 70.57 L 46.00 82.13 A 4.25 4.25 0 0 1 40.13 76.01 Z"
        fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
